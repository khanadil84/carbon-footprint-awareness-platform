version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: UTC
    open-pull-requests-limit: 10
    versioning-strategy: increase
    groups:
      react:
        patterns:
          - react
          - react-dom
          - react-router-dom
        update-types:
          - minor
          - patch
      eslint:
        patterns:
          - eslint*
          - '@eslint/*'
        update-types:
          - minor
          - patch
      vite:
        patterns:
          - vite
          - '@vitejs/*'
        update-types:
          - minor
          - patch

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '08:00'
      timezone: UTC
    open-pull-requests-limit: 5
    groups:
      actions:
        patterns:
          - '*'
        update-types:
          - minor
          - patch
